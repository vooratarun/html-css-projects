<div class="post">
  <div class="post__top">
    <img class="user__avatar post__avatar" [src]="post.avatar" [alt]="post.author + ' avatar'" />
    <div class="post__topInfo">
      <h3>{{ post.author }}</h3>
      <p>{{ post.timestamp }}</p>
    </div>
  </div>

  <div class="post__bottom">
    <p>{{ post.message }}</p>
  </div>

  <div class="post__image" *ngIf="post.imageUrl">
    <img [src]="post.imageUrl" [alt]="post.message" />
  </div>

    <div class="post__options">
        @for (option of postOptions; track option.label) {
            <div class="post__option">
              <span class="material-icons">
                {{ option.icon }}
              </span>
                <p>{{ option.label }}</p>
            </div>
        }
    </div>

</div>
