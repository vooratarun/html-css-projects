<div class="feed">
  <div class="feed__inputContainer">
    <div class="feed__input">
      <i class="material-icons"> create </i>
      <form>
        <input type="text" />
        <button type="submit">Send</button>
      </form>
    </div>

      <div class="feed__inputOptions">
          <div
                  class="inputOption"
                  *ngFor="let option of feedOptions"
                  (click)="onFeedOptionClick(option)">
              <i
                      class="material-icons"
                      [style.color]="option.color"
              >
                  {{ option.icon }}
              </i>

              <h4>{{ option.label }}</h4>
          </div>
      </div>  </div>

  <div class="post" *ngFor="let post of posts; trackBy: trackByPostId">
    <div class="post__header">
      <i class="material-icons sidebar__topAvatar"> account_circle </i>
      <div class="post__info">
        <h2>{{ post.author }}</h2>
        <p>{{ post.role }}</p>
      </div>
    </div>

    <div class="post__body">
      <p>{{ post.message }}</p>
    </div>

      <div class="feed__inputOptions">
          @for (option of inputOptions; track option.label) {
              <div class="inputOption"
                   (click)="onInputOptionClick(option)">
                  <i
                          class="material-icons"
                          [style.color]="option.color"
                  >
                      {{ option.icon }}
                  </i>

                  <h4>{{ option.label }}</h4>
              </div>
          }
      </div>
  </div>
</div>
